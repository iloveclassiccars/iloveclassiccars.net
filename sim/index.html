<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>I Love Classic Cars 시뮬레이션</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#171B26;color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:#fff;text-decoration:none}
svg{display:block}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{flex-shrink:0;min-height:68px;padding:10px 16px;background:#1F4D36;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:6px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:24px;white-space:nowrap}
.logo svg{width:24px;height:22px}
.btns{display:flex;gap:8px;flex-shrink:0}
.btns button{height:44px;padding:0 12px;background:transparent;border:1px solid rgba(255,255,255,.75);border-radius:12px;color:#fff;font:500 14px 'Noto Sans KR',sans-serif;white-space:nowrap;cursor:pointer}
main{flex:1;width:100%;padding:20px 20px 0;display:flex;flex-direction:column}
.hero{flex-shrink:0;padding:16px 16px 10px;background:rgba(42,168,75,.16);border:1px solid rgba(255,255,255,.2);border-radius:22px;display:flex;flex-direction:column;gap:10px}
.hero h1{margin:0;font-size:18px;line-height:24px;white-space:nowrap}
.hero p{margin:2px 0 0;font-size:13px;line-height:18px;color:#C3CCD6}
.hero svg{width:100%;max-width:312px;height:auto;align-self:center}
.sp{flex:1;min-height:20px}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
.tile{display:flex;flex-direction:column;align-items:center}
.ico{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.ico svg{width:36px;height:36px}
.ico.big svg{width:48px;height:48px}
.ko{margin-top:10px;font-size:15px;font-weight:700;line-height:20px;white-space:nowrap}
.en{margin-top:2px;font-size:11px;line-height:14px;color:#C3CCD6;white-space:nowrap}
.search{flex-shrink:0;height:48px;padding:0 16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:24px}
.search input{flex:1;min-width:0;height:44px;background:transparent;border:0;outline:0;color:#fff;font:16px 'Noto Sans KR',sans-serif}
.search input::placeholder{color:#C3CCD6;opacity:1}
.s20{width:20px;height:20px;flex-shrink:0}.s24{width:24px;height:24px}
.cam{width:44px;height:44px;flex-shrink:0;margin-right:-10px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer}
.search.pc{display:none}
.dock{flex-shrink:0;margin:12px 0;padding:12px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;background:rgba(255,255,255,.08);border-radius:26px}
.dk{display:flex;flex-direction:column;align-items:center;gap:6px}
.dki{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
.dki svg{width:28px;height:28px}
.dkt{font-size:12px;font-weight:500;line-height:16px;white-space:nowrap}
.boards{display:none}
footer{flex-shrink:0;height:36px;background:#1F4D36;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:600;white-space:nowrap}
footer svg{width:13px;height:12px}
@media (max-width:359px){.logo{font-size:20px}.btns button{padding:0 8px}}
@media (min-width:900px){
header{min-height:76px;padding:14px 32px;gap:14px 24px;flex-wrap:wrap}
.logo{font-size:30px}.logo svg{width:29px;height:27px}
.search.pc{display:flex;flex:1 1 320px;max-width:560px}
.search.mo{display:none}
main{max-width:1120px;margin:0 auto;padding:36px 32px 40px;gap:40px}
.sp{display:none}
.hero{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 40px;padding:28px 36px;border-radius:26px}
.hero h1{font-size:30px;line-height:40px}
.hero p{margin-top:6px;font-size:16px;line-height:24px}
.hero svg{max-width:460px;align-self:auto}
.menu{grid-template-columns:repeat(6,minmax(0,1fr));gap:24px 16px}
.ico{width:88px;height:88px;border-radius:26px}
.ico svg{width:44px;height:44px}.ico.big svg{width:58px;height:58px}
.ko{margin-top:12px;font-size:17px;line-height:24px}
.en{font-size:13px;line-height:18px}
.dock{margin:0;padding:0;background:transparent;border-radius:0;gap:16px}
.dk{flex-direction:row;justify-content:center;gap:12px;height:64px;padding:0 20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);border-radius:18px}
.dki{width:auto;height:auto;background:transparent;border:0}
.dkt{font-size:16px;font-weight:700;line-height:22px}
.boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.board{padding:18px 20px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:18px;min-width:0}
.bh{height:40px;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.bh h2{margin:0;font-size:18px;line-height:26px;white-space:nowrap}
.ben{font-size:13px;color:#C3CCD6;white-space:nowrap}
.row{height:40px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid rgba(255,255,255,.1);font-size:15px}
.rt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd{flex-shrink:0;font-size:13px;color:#C3CCD6;white-space:nowrap}
}

.logo{color:#fff}
.simbar{flex-shrink:0;padding:4px 8px;background:#F2C14E;color:#171B26;font-size:12px;font-weight:700;line-height:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#board{display:none;flex-direction:column;gap:14px;padding-bottom:28px}
body.inboard #home{display:none}
body.inboard #board{display:flex}
#home{flex:1;display:flex;flex-direction:column}
.back{align-self:flex-start;height:44px;padding:0 14px;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.4);border-radius:12px;font-size:14px;font-weight:500}
.bt{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
.bt .dot{width:16px;height:16px;border-radius:5px;flex-shrink:0}
.bt h1{margin:0;font-size:22px;line-height:30px;white-space:nowrap}
.bt .ben{font-size:13px;color:#C3CCD6;white-space:nowrap}
.sim{margin-left:auto;padding:4px 10px;border:1px solid #F2C14E;border-radius:999px;color:#F2C14E;font-size:12px;font-weight:700;white-space:nowrap}
.list{border-top:1px solid rgba(255,255,255,.25)}
.p{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.p .n{display:none}
.p .t{font-size:15px;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1/-1}
.p .m{font-size:12px;line-height:18px;color:#C3CCD6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1/-1}
.cc{display:inline-block;min-width:24px;margin-right:6px;padding:0 4px;border:1px solid rgba(255,255,255,.45);border-radius:4px;font-size:11px;line-height:16px;font-weight:700;text-align:center;color:#fff}
.p.part .t{grid-column:1}
.p.part .pr{font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
.p.part .m{grid-column:1/-1}
.lhead{display:none}
#post{display:none;flex-direction:column;gap:16px;padding-bottom:28px}
body.inpost #home{display:none}
body.inpost #post{display:flex}
.art{padding:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:18px}
.art h1{margin:0;font-size:20px;line-height:28px}
.pm{margin-top:8px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.14);font-size:13px;line-height:20px;color:#C3CCD6}
.pb{margin-top:16px;font-size:16px;line-height:28px}
.pb p{margin:0 0 14px}
.pb .note{color:#F2C14E;font-size:13px;line-height:20px;margin:0}
.pnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.pnav a,.pnav button{height:44px;padding:0 14px;display:flex;align-items:center;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:12px;color:#fff;font:500 14px 'Noto Sans KR',sans-serif;white-space:nowrap;cursor:pointer}
.pnav .off{visibility:hidden}
@media (min-width:900px){.art{padding:32px 36px}.art h1{font-size:26px;line-height:36px}.pb{max-width:720px}}
@media (min-width:900px){
#home{gap:40px}
#board{gap:18px}
.bt h1{font-size:28px;line-height:38px}
.lhead,.p{display:grid;grid-template-columns:56px minmax(0,1fr) 210px 150px 64px 64px;gap:0 16px;align-items:center}
.lhead{padding:10px 0;font-size:13px;color:#C3CCD6;border-top:1px solid rgba(255,255,255,.25)}
.list{border-top:1px solid rgba(255,255,255,.25)}
.p{padding:0;height:44px}
.p .n{display:block;font-size:13px;color:#C3CCD6}
.p .t,.p .m{grid-column:auto}
.p .c{font-size:13px;color:#C3CCD6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{text-align:right}
.p.club,.lhead.club{grid-template-columns:56px 300px minmax(0,1fr)}
.p.part,.lhead.part{grid-template-columns:56px minmax(0,1fr) 210px 140px}
.p.part .t,.p.part .m{grid-column:auto}
}
/* ---- board polish ---- */
#board,#post,#write{display:none;flex-direction:column;gap:14px;padding-bottom:28px}
body.inboard #home,body.inpost #home,body.inwrite #home{display:none}
body.inboard #board,body.inpost #post,body.inwrite #write{display:flex}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex-shrink:0;height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.3);border-radius:20px;font-size:14px;font-weight:500;white-space:nowrap}
.tabs a.on{background:#1B8438;border-color:#1B8438;font-weight:700}
.tabs a.hm{padding:0 12px}
.tool{display:flex;align-items:center;gap:10px}
.cnt{font-size:13px;color:#C3CCD6;white-space:nowrap;margin-right:auto}
.views{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:12px;overflow:hidden}
.views button{height:40px;padding:0 10px;background:transparent;border:0;border-left:1px solid rgba(255,255,255,.3);color:#fff;font:500 13px 'Noto Sans KR',sans-serif;white-space:nowrap;cursor:pointer}
.views button:first-child{border-left:0}
.views button.on{background:#1B8438;font-weight:700}
.write{height:40px;padding:0 14px;display:flex;align-items:center;background:#1B8438;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap}
.badge{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;font-size:12px;line-height:18px;font-weight:700;vertical-align:1px}
.badge.sell{background:#1B8438;color:#fff}
.badge.buy{background:#F2C14E;color:#171B26}
.badge.new{background:#E5262D;color:#fff}
.list a.p:hover{background:rgba(255,255,255,.05)}
.list.tv .p{padding:0;height:44px;grid-template-columns:minmax(0,1fr) auto;gap:0 12px}
.list.tv .p .t{grid-column:1;font-size:15px}
.list.tv .p .dd{font-size:12px;color:#C3CCD6;white-space:nowrap}
.list.pv{border-top:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}
.card{display:flex;flex-direction:column;min-width:0}
.thumb{aspect-ratio:4/3;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb svg{width:64%;height:auto;opacity:.9}
.card .t{margin-top:8px;font-size:14px;line-height:20px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{margin-top:2px;font-size:12px;line-height:18px;color:#C3CCD6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:36px 0;text-align:center;font-size:14px;color:#C3CCD6}
.pager{display:flex;justify-content:center;gap:6px}
.pager button{min-width:44px;height:44px;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:12px;color:#fff;font:500 14px 'Noto Sans KR',sans-serif;cursor:pointer}
.pager button.on{background:#1B8438;border-color:#1B8438;font-weight:700}
.bsearch{height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:12px}
.bsearch svg{width:18px;height:18px;flex-shrink:0}
.bsearch input{flex:1;min-width:0;height:40px;background:transparent;border:0;outline:0;color:#fff;font:15px 'Noto Sans KR',sans-serif}
.bsearch input::placeholder{color:#C3CCD6;opacity:1}
.pm .who{display:block}
.pact{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.pact button,.pnav a{height:44px;padding:0 14px;display:flex;align-items:center;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:12px;color:#fff;font:500 14px 'Noto Sans KR',sans-serif;white-space:nowrap;cursor:pointer}
.pnav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pnav a{justify-content:center;min-width:0}
.pnav #pnext{justify-self:end}.pnav #pprev{justify-self:start}
.pnav .off{visibility:hidden}
.cmt{padding:18px 20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:18px;display:flex;flex-direction:column;gap:12px}
.cmt h2{margin:0;font-size:16px;line-height:24px}
.cmt .c1{padding:10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:15px;line-height:22px;overflow-wrap:anywhere}
.cmt .c1 small{display:block;font-size:12px;color:#C3CCD6}
.cmt form{display:flex;gap:8px}
.cmt input{flex:1;min-width:0;height:44px;padding:0 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:12px;color:#fff;font:15px 'Noto Sans KR',sans-serif}
.cmt input::placeholder{color:#C3CCD6;opacity:1}
.cmt form button,.wf .go{height:44px;padding:0 16px;background:#1B8438;border:0;border-radius:12px;color:#fff;font:700 14px 'Noto Sans KR',sans-serif;white-space:nowrap;cursor:pointer}
.wf{padding:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:18px;display:flex;flex-direction:column;gap:14px}
.wf .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.wf label,.wf .lb{font-size:13px;font-weight:700;color:#C3CCD6}
.wf input,.wf select,.wf textarea{width:100%;min-width:0;height:44px;padding:0 12px;background:#20263A;border:1px solid rgba(255,255,255,.3);border-radius:12px;color:#fff;font:15px 'Noto Sans KR',sans-serif}
.wf textarea{height:160px;padding:10px 12px;line-height:24px;resize:vertical}
.wf .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.wf .three{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,.9fr);gap:10px}
.wf .err{min-height:20px;font-size:13px;line-height:20px;color:#FFB4B4}
.wf .acts{display:flex;justify-content:flex-end;gap:8px}
.wf .cancel{height:44px;padding:0 16px;display:flex;align-items:center;border:1px solid rgba(255,255,255,.4);border-radius:12px;font-size:14px;font-weight:500}
.wf .hint{font-size:13px;line-height:20px;color:#F2C14E;margin:0}
.seg{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:12px;overflow:hidden;align-self:flex-start}
.seg button{height:44px;padding:0 18px;background:transparent;border:0;border-left:1px solid rgba(255,255,255,.3);color:#fff;font:500 14px 'Noto Sans KR',sans-serif;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:#1B8438;font-weight:700}
@media (max-width:359px){.views button{padding:0 7px}.write{padding:0 10px}.bt .ben{display:none}}
@media (min-width:900px){
#board,#post,#write{gap:18px}
.tabs{margin:0;padding:0;overflow:visible;flex-wrap:wrap}
.list.lv .p{display:grid;grid-template-columns:minmax(0,1fr);height:auto;padding:12px 0;gap:2px}
.list.lv .p .t{font-size:16px;line-height:24px}
.list.lv .p .m{font-size:13px}
.list.tv .p{grid-template-columns:56px minmax(0,1fr) 210px 150px 64px 64px;gap:0 16px}
.list.tv .p.club{grid-template-columns:56px 300px minmax(0,1fr)}
.list.tv .p.part{grid-template-columns:56px minmax(0,1fr) 210px 140px}
.list.pv{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 20px}
.list.tv .p .t{grid-column:auto}
.card .t{font-size:15px;line-height:22px}
.bsearch{align-self:center;width:360px}
.wf{padding:28px 32px;max-width:760px}
.cmt{max-width:none}
}

body{word-break:keep-all;overflow-wrap:break-word}
</style>
</head>

<header>

var BR={'Mercedes-Benz':['W123','W124','W126','W140','W201','R129'],'BMW':['E30','E34','E36','E38'],'Porsche':['911 (964)','911 (993)','944','928'],'Hyundai':['포니','각그랜저','쏘나타2','갤로퍼'],'Kia':['프라이드','콩코드','세피아'],'Volvo':['240','740','850'],'Saab':['900','9000'],'Volkswagen':['골프 Mk2','골프 Mk3','비틀'],'Mazda':['MX-5 (NA)','RX-7'],'Jaguar':['XJ6','XJS']};
function $(id){return document.getElementById(id);}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;}
function cc(code){return el('span','cc',code);}
function wide(){return window.matchMedia('(min-width:900px)').matches;}
function carTxt(it){return it.car+(it.yr?" '"+it.yr:'');}
function titleNode(k,it,cls){var t=el('span',cls||'t');var s=it.t;
  if(it.mine){t.appendChild(el('span','badge new','새 글'));}
  if(k==='market'){var m=s.match(/^(팝니다|삽니다) · (.*)$/);if(m){t.appendChild(el('span','badge '+(m[1]==='팝니다'?'sell':'buy'),m[1]));s=m[2];}}
  t.appendChild(document.createTextNode(s));return t;}
function homeCards(){var box=$('cards');ORDER.forEach(function(k){var b=D[k];var s=el('section','board');var h=el('a','bh');h.href='#'+k;var d=el('span','dot');d.style.background=b.col;h.appendChild(d);h.appendChild(el('h2','',b.ko));h.appendChild(el('span','ben',b.en));s.appendChild(h);b.items.slice(0,7).forEach(function(it,i){var r=el('a','row');r.href=POSTS[k]?('#'+k+'-'+(b.items.length-i)):('#'+k);r.appendChild(titleNode(k,it,'rt'));r.appendChild(el('span','rd',k==='parts'?it.price+'원':(k==='clubs'?it.cc:it.d)));s.appendChild(r);});box.appendChild(s);});}
function tabs(k){var T=$('tabs');T.textContent='';var h=el('a','hm','← 첫 화면');h.href='#home';T.appendChild(h);ORDER.forEach(function(x){var a=el('a',x===k?'on':'',D[x].ko);a.href='#'+x;if(x===k)a.setAttribute('aria-current','page');T.appendChild(a);});}
function centerTab(){var T=$('tabs'),on=T.querySelector('.on');if(!on)return;try{var a=on.getBoundingClientRect(),b=T.getBoundingClientRect();T.scrollLeft+=a.left-b.left-(b.width-a.width)/2;}catch(e){}}
function filtered(k){var q=S.q.trim().toLowerCase();var a=D[k].items.map(function(it,i){return {it:it,n:D[k].items.length-i};});if(!q)return a;return a.filter(function(o){return (o.it.t+' '+(o.it.car||'')).toLowerCase().indexOf(q)>=0;});}
function board(k){var b=D[k],w=wide(),isPost=!!POSTS[k];
  tabs(k);
  $('bdot').style.background=b.col;$('bko').textContent=b.ko;$('ben').textContent=b.en;
  var unit=k==='parts'?'부품':(k==='clubs'?'클럽':'글');
  $('bsim').textContent='가상 '+(unit==='글'?'게시물':unit);
  var view=isPost?(S.view||(w?'table':'list')):'table';
  $('views').style.display=isPost?'':'none';$('wbtn').style.display=isPost?'':'none';
  if(isPost){$('wbtn').href='#'+k+'-write';[].forEach.call($('views').children,function(bt){var on=bt.getAttribute('data-v')===view;bt.className=on?'on':'';bt.setAttribute('aria-pressed',on?'true':'false');});}
  var all=filtered(k);$('cnt').textContent=unit+' '+all.length+'개';
  var per=view==='photo'?12:15,pages=Math.max(1,Math.ceil(all.length/per));if(S.page>pages)S.page=pages;
  var rows=all.slice((S.page-1)*per,S.page*per);
  var lh=$('lhead');lh.textContent='';
  var showHead=w&&view==='table';lh.style.display=showHead?'':'none';
  lh.className='lhead'+(k==='clubs'?' club':(k==='parts'?' part':''));
  if(showHead){var cols=k==='clubs'?['번호','이름 (나라)','한 줄 설명']:(k==='parts'?['번호','부품 이름','차종','가격']:['번호','제목','차','SNS','날짜','조회']);cols.forEach(function(c){lh.appendChild(el('span',(c==='가격'||c==='조회')?'r':'',c));});}
  var L=$('list');L.textContent='';L.className='list'+(isPost?(view==='photo'?' pv':(view==='list'?' lv':' tv')):'');
  if(!rows.length){L.className='list';L.appendChild(el('div','empty','찾는 글이 없습니다.'));}
  rows.forEach(function(o){var it=o.it,n=o.n,p;
    if(k==='parts'){p=el('div','p part');p.appendChild(el('span','n',String(n)));p.appendChild(el('span','t',it.t));if(w){p.appendChild(el('span','c',it.car));p.appendChild(el('span','pr',it.price+'원'));}else{p.appendChild(el('span','pr',it.price+'원'));p.appendChild(el('span','m',it.car));}}
    else if(k==='clubs'){p=el('div','p club');p.appendChild(el('span','n',String(n)));var sp=it.t.split(' — ');var t=el('span','t');t.appendChild(cc(it.cc));t.appendChild(document.createTextNode(sp[0]));p.appendChild(t);p.appendChild(el('span',w?'c':'m',sp[1]||''));}
    else if(view==='photo'){p=el('a','card');p.href='#'+k+'-'+n;var th=el('span','thumb');th.style.background=TH[n%TH.length];th.innerHTML=CARSVG;p.appendChild(th);p.appendChild(titleNode(k,it));var m=el('span','m');m.appendChild(cc(it.cc));m.appendChild(document.createTextNode(carTxt(it)+' · '+it.d));p.appendChild(m);}
    else if(view==='list'){p=el('a','p');p.href='#'+k+'-'+n;p.appendChild(titleNode(k,it));var m2=el('span','m');m2.appendChild(cc(it.cc));m2.appendChild(document.createTextNode(carTxt(it)+' · '+it.sns+' · '+it.d+' · 조회 '+it.v));p.appendChild(m2);}
    else{p=el('a','p');p.href='#'+k+'-'+n;if(w){p.appendChild(el('span','n',String(n)));p.appendChild(titleNode(k,it));var c1=el('span','c');c1.appendChild(cc(it.cc));c1.appendChild(document.createTextNode(carTxt(it)));p.appendChild(c1);p.appendChild(el('span','c',it.sns));p.appendChild(el('span','c',it.d));p.appendChild(el('span','c r',String(it.v)));}else{p.appendChild(titleNode(k,it));p.appendChild(el('span','dd',it.d));}}
    L.appendChild(p);});
  var P=$('pager');P.textContent='';if(pages>1){for(var i=1;i<=pages;i++){(function(i){var bt=el('button',i===S.page?'on':'',String(i));bt.type='button';bt.setAttribute('aria-label',i+'쪽');if(i===S.page)bt.setAttribute('aria-current','page');bt.addEventListener('click',function(){S.page=i;board(k);window.scrollTo(0,0);});P.appendChild(bt);})(i);}}
  $('bq').placeholder=isPost?'이 게시판에서 찾기':(k==='parts'?'부품 이름으로 찾기':'클럽 이름으로 찾기');}
function post(k,n){var b=D[k],idx=b.items.length-n,it=b.items[idx];
  $('pdot').style.background=b.col;$('pko').textContent=b.ko;$('pen').textContent=b.en;$('pback').href='#'+k;$('plist').href='#'+k;
  var pt=$('pt');pt.textContent='';var tn=titleNode(k,it,'');while(tn.firstChild)pt.appendChild(tn.firstChild);
  var pm=$('pm');pm.textContent='';pm.appendChild(cc(it.cc));pm.appendChild(document.createTextNode(carTxt(it)+' · '+it.sns));pm.appendChild(el('span','who','2026.'+it.d+' · 조회 '+it.v));
  var pb=$('pb');pb.textContent='';(it.body?it.body.split(/\n+/):[BODY[k][n%3]]).forEach(function(x){if(x.trim())pb.appendChild(el('p','',x));});
  pb.appendChild(el('p','note',it.mine?'※ 시뮬레이션에서 방금 쓴 글입니다. 새로 고치면 사라집니다.':'※ 화면을 시험하려고 넣은 가상 글입니다.'));
  var pv=$('pprev'),nx=$('pnext');
  if(n>1){pv.href='#'+k+'-'+(n-1);pv.className='';}else{pv.removeAttribute('href');pv.className='off';}
  if(n<b.items.length){nx.href='#'+k+'-'+(n+1);nx.className='';}else{nx.removeAttribute('href');nx.className='off';}
  $('pcopy').textContent='URL 복사';$('pshare').textContent='공유';
  S.pk=k+'-'+n;comments();}
function comments(){var a=CM[S.pk]||[];$('ch').textContent='댓글 '+a.length+'개';var L=$('cl');L.textContent='';a.forEach(function(x){var d=el('div','c1',x);d.appendChild(el('small','','방금 · 시뮬레이션'));L.appendChild(d);});}
function fillSel(s,arr,ph){s.textContent='';if(ph){var o0=el('option','',ph);o0.value='';s.appendChild(o0);}arr.forEach(function(a){var o=el('option','',a[1]);o.value=a[0];s.appendChild(o);});}
function writeForm(k){var b=D[k];$('wdot').style.background=b.col;$('wko').textContent=b.ko+' 글쓰기';$('wback').href='#'+k;$('wcancel').href='#'+k;
  fillSel($('wcc'),COUNTRY.map(function(c){return [c[0],c[1]+' ('+c[0]+')'];}));
  fillSel($('wsns'),SNSL);
  fillSel($('wbr'),Object.keys(BR).map(function(x){return [x,x];}).concat([['__','직접 입력']]),'브랜드');
  models();$('wkind').style.display=k==='market'?'':'none';
  ['wacc','wyr','wtt','wbd','wmodel2'].forEach(function(i){$(i).value='';});$('werr').textContent='';S.wk=k;S.kind='팝니다';seg();}
function models(){var v=$('wbr').value,m=$('wmd'),free=$('wmodel2');
  if(v&&v!=='__'){fillSel(m,BR[v].map(function(x){return [x,x];}).concat([['__','직접 입력']]),'모델');m.disabled=false;}else{fillSel(m,[],v==='__'?'직접 입력':'모델');m.disabled=true;}
  free.style.display=(v==='__'||m.value==='__')?'':'none';}
function seg(){[].forEach.call($('wseg').children,function(bt){var on=bt.textContent===S.kind;bt.className=on?'on':'';bt.setAttribute('aria-pressed',on?'true':'false');});}
function submitPost(){var k=S.wk,br=$('wbr').value,md=$('wmd').value,car=(br==='__'||md==='__'||!md)?$('wmodel2').value.trim():md,yr=$('wyr').value.trim(),tt=$('wtt').value.trim(),acc=$('wacc').value.trim().replace(/^@/,''),bd=$('wbd').value.trim();
  var e='';if(!acc)e='SNS 계정을 적어 주십시오.';else if(!car)e='차 모델을 고르거나 적어 주십시오.';else if(!/^(19|20)\d\d$/.test(yr))e='연식을 네 자리 숫자로 적어 주십시오. 예: 1997';else if(!tt)e='제목을 적어 주십시오.';else if(!bd)e='내용을 적어 주십시오.';
  if(e){$('werr').textContent=e;return;}
  if(k==='market')tt=S.kind+' · '+tt;
  D[k].items.unshift({cc:$('wcc').value,car:car,yr:yr.slice(2),t:tt,sns:$('wsns').value+' @'+acc,d:'11.20',v:0,body:bd,mine:true});
  S.page=1;S.q='';$('bq').value='';location.hash='#'+k;}
function route(){var h=(location.hash||'').replace('#','');var m=h.match(/^([a-z]+)-(\d+)$/),wm=h.match(/^([a-z]+)-write$/);var k=m?m[1]:(wm?wm[1]:h);
  document.body.classList.remove('inboard','inpost','inwrite');
  if(wm&&POSTS[k]){writeForm(k);document.body.classList.add('inwrite');S.cur='';}
  else if(m&&POSTS[k]&&+m[2]>=1&&+m[2]<=D[k].items.length){post(k,+m[2]);document.body.classList.add('inpost');S.cur='';}
  else if(D[k]){if(S.cur!==k&&S.last!==k){S.page=1;S.q='';$('bq').value='';}S.cur=k;S.last=k;board(k);document.body.classList.add('inboard');centerTab();}
  else{S.cur='';S.last='';}
  window.scrollTo(0,0);}
function copyUrl(bt){try{navigator.clipboard.writeText(location.href).then(function(){bt.textContent='복사했습니다';},function(){bt.textContent='복사하지 못했습니다';});}catch(e){bt.textContent='복사하지 못했습니다';}}
$('pcopy').addEventListener('click',function(){copyUrl(this);});
$('pshare').addEventListener('click',function(){var bt=this;if(navigator.share){try{navigator.share({title:$('pt').textContent,url:location.href}).catch(function(){});}catch(e){copyUrl(bt);}}else{copyUrl(bt);}});
[].forEach.call($('views').children,function(bt){bt.addEventListener('click',function(){S.view=bt.getAttribute('data-v');S.page=1;if(S.cur)board(S.cur);});});
$('bq').addEventListener('input',function(){S.q=this.value;S.page=1;if(S.cur)board(S.cur);});
$('wbr').addEventListener('change',models);$('wmd').addEventListener('change',function(){$('wmodel2').style.display=(this.value==='__'||$('wbr').value==='__')?'':'none';});
[].forEach.call($('wseg').children,function(bt){bt.addEventListener('click',function(){S.kind=bt.textContent;seg();});});
$('wform').addEventListener('submit',function(e){e.preventDefault();submitPost();});
$('cform').addEventListener('submit',function(e){e.preventDefault();var v=$('cin').value.trim();if(!v)return;(CM[S.pk]=CM[S.pk]||[]).push(v);$('cin').value='';comments();});
homeCards();route();
window.addEventListener('hashchange',route);
var mq=window.matchMedia('(min-width:900px)');var re=function(){if(S.cur)board(S.cur);};if(mq.addEventListener)mq.addEventListener('change',re);else if(mq.addListener)mq.addListener(re);
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href="#"]');if(a)e.preventDefault();});
</script>
</body>
</html>

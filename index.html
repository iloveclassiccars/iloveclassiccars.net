 why:["이 계산기를 만든 이유","<div class=\"why why2\"><p class=\"wl\">귀한 차는 귀하게</p>\n\n\n<p>나는 1997년식 벤츠 W140 S600을 탄다. 특별할 것 없는 한 사람의 오너다.</p>\n<p>그 차를 믿고 맡긴 정비소가 있었다. 돌아온 차에는 바꿔치기된 부품이 들어 있었고, 청구서의 숫자는 부풀려져 있었다. 그때는 몰랐다. 그 차는 가족을 태운 채 고속도로 갓길에 두 번 멈춰 섰다.</p>\n<p>나중에야 알았다. 순정 부품값이 정비소에서 부르던 애프터마켓 부품값보다 낮은 경우가 많았다는 것을. 우리는 몰라서 당했다.</p>\n<p>그래서 이 계산기를 만들었다. 누군가의 가족이 갓길에서 위험에 처하는 일, 클래식카에 첫발을 내딛는 20대 청년이 같은 일로 고통받는 일이 조금이나마 줄었으면 했다.</p>\n<p class=\"wl\">다짐은 하나였다. 내 차 부품은 내가 직접 사고, 조립은 내 눈앞에서.</p>\n\n<div class=\"wsep\">◆ ◆ ◆</div>\n\n<p>공장에서 나온 차가 가장 좋다. 벤츠만 그런 것이 아니다. 모든 제조사의 차가 그렇다. 자동차 공학 엔지니어들이 부품 하나하나의 크기와 재질, 무게와 소리, 떨림까지 맞춰 가장 좋은 균형을 잡아 두었기 때문이다. 검증되지 않은 애프터마켓 부품은 그 균형을 조용히 무너뜨린다.</p>\n<div class=\"wlist\">\n<p>치수가 다르다. 조금만 어긋나도 잡소리와 누유, 빠른 마모가 따라온다.</p>\n<p>재질이 다르다. 고무와 금속이 달라지면 수명과 떨림이 달라진다.</p>\n<p>세팅값이 다르다. 차의 컴퓨터는 순정의 값에 맞춰져 있다. 어긋나면 시동과 힘, 연비에 문제가 생기고 경고등이 켜진다.</p>\n<p>승차감과 소음이 다르다. 마운트와 부싱, 쇼크의 단단함은 차 전체에 맞춰 조율된 값이다.</p>\n<p>맞물림이 다르다. 핀 하나, 볼트 하나가 다르면 억지로 끼운 자리에서 또 다른 고장이 난다.</p>\n<p>시험이 다르다. 순정 부품은 혹서·혹한 시험과 긴 내구 시험을 거쳐 나온다.</p>\n<p>그리고 고장은 번진다. 싼 부품 하나가 더 큰 수리비로 돌아온다.</p>\n</div>\n<p class=\"wn\">물론 보쉬나 레므포더처럼 자동차 회사에 직접 납품하는 회사가 같은 규격으로 만든 부품(OES)은 순정과 같은 대접을 받을 만하다.</p>\n<p>오래된 차는 고장 나는 차가 아니다. 제대로 고쳐 주면 다시 오랜 세월을 달린다. 귀한 차를 귀하게 대접하고, 아끼고 사랑하며 오래 타셨으면 한다.</p>\n\n<div class=\"wsep\">◆ ◆ ◆</div>\n\n<p>정비사님들께는 고마운 마음이 먼저다. 40년 동안 우리 차를 고쳐 주신 분들이고, 차주와 함께 가는 동반자다.</p>\n<p>일부 정크 업체가 흙탕물을 일으키는 것도 사실이다. 하지만 그분들도 기준이 없어 샛길로 샌 것이라 생각한다. 이 계산기가 조금이나마 그 기준이 되어, 모두가 올바른 길을 함께 걸었으면 한다.</p>\n\n<div class=\"wsep\">◆ ◆ ◆</div>\n\n<p>지금은 v1.2다. 앞서 올린 것이 v1.1이었다. 처음 설계한 분량의 5% 정도까지 왔다. 버전마다 열두 번씩, v12.12까지 모두 144번 다듬어 v12에서 마무리하려 한다.</p>\n<p>버전이 오를 때마다 전 세계의 클래식카와 앞으로 클래식카가 될 영타이머를 하나씩 담을 것이다. 부품 이름과 번호, 가격만이 아니다. EPC 도면과 배선도, 고치는 방법, 그 부품이 왜 그렇게 만들어졌는지 자동차 공학의 원리까지 담은 아카이브를 만들고 싶다.</p>\n<p>데이터를 모으는 일은 어렵지 않다. 어려운 것은 차대번호에 맞는 부품인지 하나하나 대조하는 일이다. 단 한 줄이라도 틀리면 회원님들이 큰 손실을 입을 수 있다. 그래서 조금 늦어질 것이다.</p>\n<p>생업이 따로 있어 걸음이 빠르지 못하다. 먹고사는 일에 쫓기다 보니, 보내 주시는 말씀에 일일이 답하지 못한다. 그래도 회원님들의 지지와 격려가 이 일을 이어 가게 하는 가장 큰 힘이다. 깊이 감사드린다.</p>\n<p class=\"ws\">1997년식 W140 S600 오너<br>I ♥ Classic Cars 부품 계산기 v1.2</p>\n\n</div>","life"],

v></div>\n <div style=\"margin:12px 8px 0;font-size:10px;color:#b9c0cc;line-height:1.6;border-top:1px solid #2a3142;padding-top:8px\">헷갈리는 글자<br><span class=\"vg-mono\" style=\"color:#fff\">8↔B &nbsp;5↔S &nbsp;2↔Z &nbsp;6↔G</span><br><br>자동으로 고쳐요<br><span class=\"vg-mono\" style=\"color:#fff\">O→0 &nbsp;I→1 &nbsp;Q→0</span><br><span style=\"font-size:9.5px\">(차대번호엔 I·O·Q가 없어요)</span></div>\n </div>\n <div class=\"vg-cap\">밑줄 글자 고르기</div><div class=\"vg-cx\">등록증과 한 번 맞춰 보면 확실</div></div>\n\n<!-- 5 -->\n<div class=\"vg-st\"><div class=\"vg-no\">5</div><div class=\"vg-ph\">\n <div class=\"vg-gbtn\" style=\"margin:12px 8px;padding:9px 0\">확인하고 검색</div>\n <div style=\"text-align:center;font-size:20px;color:#d9a441;line-height:1\">↓</div>\n <div style=\"margin:8px;font-size:10.5px\">\n  <div style=\"color:#2AA84B;font-weight:700;margin-bottom:5px\">Benz W140 · S600 (140.057)</div>\n  <div style=\"display:flex;justify-content:space-between;border-top:1px solid #2a3142;padding:5px 0\"><span>점화 코일</span><span>✓</span></div>\n  <div style=\"display:flex;justify-content:space-between;border-top:1px solid #2a3142;padding:5px 0\"><span>프론트 브레이크 패드</span><span>✓</span></div>\n  <div style=\"display:flex;justify-content:space-between;border-top:1px solid #2a3142;padding:5px 0\"><span>리어 쇼크 일반</span><span>✓</span></div>\n  <div style=\"color:#b9c0cc;margin-top:8px;font-size:9.5px;line-height:1.5\">내 차에 맞는 부품만 남아요.<br>W140은 차종까지, 다른 차는<br>지금은 제조사까지 가려내요.</div>\n </div>\n <div class=\"vg-bar\" style=\"position:absolute;left:0;right:0;bottom:0;justify-content:space-between;padding:0 8px;font-weight:400;font-size:9.5px\"><span>홈</span><span>공임</span><span>관부가세</span><b>합계</b></div>\n </div>\n <div class=\"vg-cap\">내 차 부품 바로 보기</div><div class=\"vg-cx\">번호가 검색창에 들어가요</div></div>\n\n</div>\n<p style=\"text-align:center;color:#9aa3a0;font-size:12px;margin-top:22px\">안 되면 ✕ 닫기 또는 '직접 입력' · 카메라가 안 켜지면 폰 설정에서 카메라 권한을 켜 주세요 · I ♥ Classic Cars</p></div>","parts"],

async function myDoc(c){const uid=await ST.user.id();if(!uid)throw 0;return ST.db.doc(c+"/"+uid)}
async function toggleLike(t){if(!ST.db||!ST.user)return;try{const r=await myDoc("likes");const cur=await r.get();let ids=(cur.exists&&cur.data().ids)||[];ids=ids.includes(t)?ids.filter(x=>x!==t):[...ids,t].slice(-1000);await r.set({ids})}catch(e){}}
const SEEN={};async function markView(t){if(!ST.db||!ST.user||SEEN[t])return;SEEN[t]=1;try{const r=await myDoc("views");const cur=await r.get();const ids=(cur.exists&&cur.data().ids)||[];if(!ids.includes(t))await r.set({ids:[...ids,t].slice(-1500)})}catch(e){}}
function fillLikes(){document.querySelectorAll("[data-like]").forEach(b=>{const t=b.dataset.like,on=(ST.myLk||[]).includes(t);b.classList.toggle("on",on);b.textContent=(on?"♥":"♡")+" 좋아요 "+((ST.lk||{})[t]||0)})}
async function togglePin(t){if(!ST.db||!ST.admin)return;try{const r=ST.db.doc("pins/list");const cur=await r.get();let ids=(cur.exists&&cur.data().ids)||[];ids=ids.includes(t)?ids.filter(x=>x!==t):[t,...ids].slice(0,10);await r.set({ids})}catch(e){}}
function fillPins(){document.querySelectorAll("[data-pin]").forEach(b=>{b.style.display=ST.admin?"":"none";b.textContent=(ST.pins||[]).includes(b.dataset.pin)?"📌 공지 내리기":"📌 공지로 올리기"})}

function fillCmts(){fillLikes();fillPins();document.querySelectorAll(".nvcs button").forEach(x=>x.classList.toggle("on",x.dataset.cms===CMSORT));document.querySelectorAll(".cml").forEach(el=>{const t=el.dataset.t;markView(t);const A=(ST.cmts||[]).filter(c=>c.t===t);const au=postAuthor(t);const top=A.filter(c=>!c.p||!A.some(z=>z.id===c.p)).sort((x,y)=>CMSORT==="asc"?(x.at||0)-(y.at||0):(y.at||0)-(x.at||0));const one=(c,rep)=>`<div class="nvc${rep?" rep":""}"><i class="nvav">${esc((c.nick||"?").slice(0,1))}</i><div class="nvcb"><div>${whoFull(c)}${au&&c.nick===au?' <i class="nvau">작성자</i>':""}</div><div class="nvct">${c.r?`<span class="nvmn">${esc(c.r)}</span> `:""}${esc(c.text||"")}</div><div class="nvcm2">${cmTime(c.at)} <button type="button" data-rp="${esc(c.p||c.id)}" data-rn="${esc(c.nick||"")}">답글쓰기</button></div><div class="nvrf"></div></div></div>`;const cnt=document.querySelector(`.cmw .nvcc2[data-t="${CSS.escape(t)}"]`);el.innerHTML=(A.length?`<div class="nvcn">댓글 <b>${A.length}</b></div>`+top.map(c=>one(c,0)+A.filter(r=>r.p===c.id).sort((x,y)=>(x.at||0)-(y.at||0)).map(r=>one(r,1)).join("")).join(""):`<div class="note">첫 댓글을 남겨 주세요.</div>`)})}

const SEED={"life": [["이야기", "첫 클래식카를 데려온 날", "키를 받던 날, 잠이 안 왔어요.\n집에 오자마자 한 일은 세 가지예요. 차 전체 사진과 동영상 찍기, 기름을 가득 넣고 트립을 0으로 맞추기, 정비 기록장 첫 장 쓰기.\n이 기록이 1년 뒤 차가 얼마나 살아났는지 보여 줘요. 여러분의 첫날은 어땠나요? 댓글로 들려주세요."], ["이야기", "\"아빠 차 냄새 좋다\" 한 날", "주말에 아이를 태우고 국도를 천천히 달렸어요.\n아이가 뒷좌석에서 \"아빠 차 냄새 좋다\" 하더니 스르르 잠들었어요.\n빠른 차는 많아요. 그런데 가족이 편히 잠드는 차는 드물어요. 그래서 오늘도 이 차를 아껴요."], ["이야기", "주차장에서 받은 쪽지", "장을 보고 나오니 와이퍼에 쪽지가 끼워져 있었어요.\n\"아버지가 타시던 차랑 똑같아요. 잘 지켜 주셔서 고맙습니다.\"\n오래된 차는 누군가의 추억을 같이 싣고 달려요. 그래서 함부로 대할 수 없어요."], ["이야기", "클래식카 오너의 사계절", "봄에는 하체를 띄워 녹과 누유를 살펴요.\n여름에는 에어컨과 냉각수를 챙겨요.\n가을은 장거리 드라이브의 계절이에요.\n겨울에는 습기 없는 곳에 두고, 한 달에 한 번은 꼭 달려 줘요."], ["이야기", "광택보다 원래 칠", "30년 된 원래 칠은 한 번 깎으면 되돌릴 수 없어요.\n반짝임을 좇다가 원칠을 잃는 경우를 많이 봐요.\n부드러운 세차와 가끔 왁스면 충분해요. 작은 흠도 그 차가 살아온 이야기예요."], ["이야기", "처음 가 본 카밋", "같은 차를 타는 사람들을 처음 만났어요.\n서로 보닛을 열어 보고, 어디서 부품을 샀는지 이야기했어요.\n혼자 끙끙 앓던 고장이 다른 사람에게는 이미 지나간 일이더라고요. 같이 타면 덜 외로워요."], ["이야기", "오래된 차가 가르쳐 준 느림", "예전엔 늘 빨리 가려고 했어요.\n이 차를 타고부터 1차선 대신 바깥 차선으로, 고속도로 대신 국도로 가요.\n창밖 풍경이 보이기 시작했어요. 느리게 가야 보이는 것들이 있어요."], ["이야기", "정비 기록장을 쓰기 시작했어요", "날짜, 주행거리, 바꾼 부품과 부품번호, 맡긴 곳, 들어간 돈.\n이 다섯 가지만 적어도 충분해요.\n기록이 쌓이면 내 차를 가장 잘 아는 사람이 내가 돼요. 다음 주인에게도 가장 큰 선물이에요."], ["이야기", "지하 주차장 대신 그늘을 고른 이유", "지하 주차장은 습기가 많아요. 오래 두면 곰팡이가 피고 배선이 상해요.\n바람이 잘 통하는 그늘이 오히려 나아요.\n어쩔 수 없이 지하에 둔다면 습기 제거제를 넉넉히 넣고, 한 달에 한 번은 꼭 달려 주세요."], ["이야기", "다음 세대에 물려주고 싶은 차", "이 차를 언젠가 누군가에게 넘겨줄 거예요.\n그때 원래 모습 그대로, 기록과 함께 넘겨주고 싶어요.\n클래식카는 내 것이기도 하지만, 잠시 맡아 두는 것이기도 해요."]], "parts": [["부품", "순정 · OEM · 애프터, 뭐가 달라요?", "순정은 자동차 회사 이름이 찍힌 부품이에요.\nOEM은 그 회사에 납품하는 공장이 만든 같은 부품이에요. 상자만 달라요.\n애프터는 다른 공장이 비슷하게 만든 부품이에요. 값은 싸지만 차에 맞춘 설계가 달라서 오래 못 가는 경우가 많아요."], ["부품", "차대번호로 내 차 부품번호 찾기", "1. 차대번호(VIN) 17자리를 확인해요. 보통 앞 유리 아래나 문 기둥에 있어요.\n2. 차대번호로 출고 사양을 조회해요.\n3. 부품 카탈로그에서 그 사양에 맞는 부품번호를 찾아요.\n같은 차종도 연식에 따라 번호가 달라요. 주문 전에 꼭 한 번 더 확인해요."], ["부품", "같은 부품, 사이트마다 값이 달라요", "같은 부품번호라도 파는 곳마다 값이 꽤 차이 나요.\n두세 곳을 비교해 보세요. 배송비와 세금까지 더해서 비교해야 진짜 값이에요.\n부품찾기 계산기에서 담으면 원화 합계를 바로 볼 수 있어요."], ["부품", "\"단종\"이라는 말, 세 가지가 있어요", "본사가 더 이상 만들지 않는 단종, 국내 수입처에 없는 단종, 한 판매처에만 없는 단종.\n\"단종이라 못 구해요\"라는 말을 들으면, 어떤 단종인지 먼저 물어보세요.\n해외에서는 아직 파는 경우가 많아요."], ["부품", "재생품(리퍼비시)은 언제 좋을까", "원래 부품의 몸체에 새 씰, 베어링, 배선을 넣어 되살린 부품이에요.\n단종된 순정이라면 재생품이 좋은 선택일 때가 많아요.\n헌 부품을 보내고 재생품을 받는 방식도 있어요."], ["부품", "해외 부품, 배송대행으로 받기", "해외 쇼핑몰은 한국으로 바로 보내 주지 않는 곳이 많아요.\n그럴 때 배송대행지를 써요. 보통 2~3주 걸려요.\n무겁고 큰 부품은 배송비가 크니, 여러 곳을 비교해 보세요."], ["부품", "관부가세, 미리 계산해 두세요", "해외 부품은 물건값 말고도 관세와 부가세, 배송비가 붙어요.\n이걸 빼고 계산하면 생각보다 비싸져요.\n부품찾기 계산기로 미리 합계를 내 보고 결정하세요."], ["부품", "너무 싼 \"순정\"은 의심하세요", "요즘은 순정 상자와 라벨까지 흉내 낸 가짜가 있어요.\n시세보다 너무 싸면 한 번 더 의심하세요.\n믿을 만한 판매처에서 사고, 받으면 생산지 표기와 품질을 꼭 확인해요."], ["부품", "조향 부품은 한꺼번에", "핸들을 돌리는 부품은 여러 개가 줄줄이 이어져 있어요.\n하나만 새것으로 바꾸면 나머지 헌 부품 때문에 효과가 반으로 줄어요.\n관련 부품을 한 번에 바꾸고, 바꾼 뒤에는 꼭 얼라인먼트를 봐요."], ["부품", "부품은 몇 달 여유 있게", "급하면 비싸고, 실수해요.\n필요한 부품 목록을 미리 만들고, 몇 달 여유를 두고 하나씩 사 모으세요.\n다 모이면 그때 정비소에 한 번에 맡기면 공임도 아껴요."], ["부품", "부품번호에 붙은 A는 뭐예요?", "벤츠 부품번호 앞의 A는 승용차 부품이라는 뜻이에요.\nA 140 540 01 17처럼 적혀 있어도, 검색할 땐 띄어쓰기 없이 넣어도 돼요.\n번호 끝 두 자리는 바뀐 판(버전)이라서, 숫자가 달라도 같은 부품일 때가 있어요."], ["부품", "대체 번호(바뀐 번호)도 확인해요", "오래된 부품은 번호가 새 번호로 바뀐 경우가 많아요.\n옛 번호로 안 나오면 \"대체 번호\"로 다시 찾아보세요.\n파는 곳에서 \"replaced by\"라고 적힌 번호가 바로 그거예요."], ["부품", "씰과 오링은 같이 바꿔요", "부품을 떼었다 붙이면 고무 씰과 오링은 다시 쓰지 않는 게 좋아요.\n값은 싸지만, 안 바꾸면 기름이나 물이 새서 다시 뜯어야 해요.\n부품을 살 때 씰도 같이 장바구니에 넣어 두세요."], ["부품", "중고 부품 살 때 볼 것", "중고는 부품번호와 떼어 낸 차의 주행거리를 물어보세요.\n고무 부품, 브레이크, 조향 부품은 중고보다 새것이 마음 편해요.\n몸체가 튼튼한 부품(손잡이, 내장 장식 같은 것)은 중고도 좋은 선택이에요."], ["부품", "부품 받으면 바로 확인해요", "상자를 열면 부품번호, 모양, 개수를 바로 맞춰 보세요.\n장착하기 전에 사진을 찍어 두면 반품할 때 편해요.\n쓰기 전에 문제를 찾아야 교환이 쉬워요."]], "service": [["정비", "벤츠 w140 s600 쿨럭 감기약 맵센서 클립 장착", "벤츠 w140 맵센서와 에어파이프를 단단하게 결합하는 클립입니다.\n이 클립이 없으면 맵센서에 과다공기 흡입 차가 부르르 떨면서 시동이 꺼지기도 합니다.\n문제는 본의 아니게 이 클립이 자주 없어지는데 정비소에 차를 맡기거나\n특히 오일 갈때 2개 클립중 1개를 분실 대충 매달아 놓는다는 것입니다\n차주는 꿈에도 생각못하고요....\nw140 s320 s500 s600 마찬가지 입니다.\n\n클립 2개중1개가 없을때 증상 처음 한두달은 괜찮습니다,\n그런데 운행 진동으로 서서히 틈새가 벌어지고......\n맵센서 과도 공기 흡입 엔진이 부르르 떨면서 부조 현상....\n쓰로틀 바디가 맛탱이 갔다거나.....\n점화코일 점화플러그가 다 됐다거나....\n심지어는헤드가스켓 삭아서 엔진을 내려야 한다는둥....\n별의별 진단들이 있기도 했습니다...\n\n2.5 달러짜리 클립 1개로 문제 해결 했습니다.\n정비소 다녀온후 어느시점 차가 갑자기 쿨럭대는 감기 증상 있으면\n맵센서 + 에어파이프 구간  점검해보시기 바랍니다.\n감사합니다.", ["img/mapclip1.jpg", "img/mapclip2.jpg", "img/mapclip3.jpg"], "2026-10-06T19:14:00+09:00"], ["정비", "정비소에 맡기기 전 꼭 할 3가지", "1. 차 전체 사진과 동영상을 찍어요.\n2. 계기판 주행거리를 찍어 둬요.\n3. 바꿀 부품에 나만 아는 표시를 해 둬요.\n의심이 아니라 서로 오해가 없게 하는 장치예요. 좋은 정비소는 오히려 반겨요."], ["정비", "견적서 읽는 법", "\"쇼바 교환\"처럼 한 줄만 적힌 견적서는 조심하세요.\n부품번호, 순정인지 애프터인지, 부품값과 공임이 따로 적혀 있어야 해요.\n정비업체는 견적서와 정비 명세서를 줘야 해요. 꼭 받아서 보관해요."], ["정비", "오일 교환에 하룻밤?", "전체 오일 교환도 보통 몇 시간이면 끝나요.\n\"하룻밤 맡기고 가라\"는 말은 한 번 더 생각해 보세요.\n가능하면 내 눈앞에서 교환하고, 넣는 오일 통을 직접 확인해요."], ["정비", "오일은 승인 규격을 확인해요", "자동차 회사는 엔진마다 맞는 오일 규격을 정해 둬요.\n오일 통에 그 승인 번호가 찍혀 있는지 보세요.\n내 차 설명서에 나온 규격과 양을 지키는 게 가장 좋아요."], ["정비", "하체 소리로 짐작해 보기", "방지턱에서 덜컥 → 링크, 부싱, 볼조인트를 살펴요.\n핸들 돌릴 때 끼익 → 고무 부싱이나 관절을 봐요.\n가속하다 놓을 때 뒤에서 쿵 → 뒤쪽 마운트나 부싱을 봐요.\n소리만으로 단정하지 말고, 띄워서 확인해요."], ["정비", "하체를 고쳤다면 얼라인먼트", "하체 부품을 바꾸면 바퀴 각도가 달라져요.\n얼라인먼트를 안 보면 핸들이 비뚤고, 타이어가 한쪽만 닳아요.\n잘 보는 곳은 조금 멀어도 찾아갈 만해요."], ["정비", "휠은 공장에서 나온 크기가 편해요", "휠을 크게 바꾸면 멋은 나지만 승차감과 하체가 힘들어해요.\n클래식카는 처음 설계된 크기에서 가장 편하게 달려요.\n바꾸기 전에 한 번 더 생각해 보세요."], ["정비", "오래 세워 둘 때", "습기 없는 곳에 두고, 배터리는 충전기를 연결하거나 떼어 둬요.\n한 달에 한 번은 시동을 걸고 충분히 달려 주세요.\n실내에는 습기 제거제를 넉넉히 넣어 두면 곰팡이를 막아요."], ["정비", "전용 진단기가 필요한 이유", "보통 진단기는 엔진 쪽만 읽는 경우가 많아요.\n변속기, 브레이크, 에어백, 서스펜션까지 보려면 그 회사 전용 진단기가 필요해요.\n정비소를 고를 때 \"이 차에 진단기 붙여 본 적 있어요?\" 하고 물어보세요."], ["정비", "헌 부품은 꼭 돌려받으세요", "떼어 낸 헌 부품을 돌려받으면 실제로 바꿨는지 알 수 있어요.\n원래 어떤 부품이 달려 있었는지도 기록이 돼요.\n돌려주기를 꺼리는 곳은 한 번 더 생각해 보세요."], ["정비", "냉각수는 색보다 규격", "냉각수는 색깔이 아니라 승인 규격을 보고 골라요.\n다른 종류를 섞으면 침전물이 생길 수 있어요.\n바꿀 땐 한 번에 다 빼고 같은 규격으로 채워요."], ["정비", "브레이크액은 2년에 한 번", "브레이크액은 공기 중 습기를 먹어요.\n오래되면 브레이크가 물렁해지고 녹이 생겨요.\n색이 진해졌다면 바꿀 때가 지난 거예요."], ["정비", "배터리가 자주 방전되면", "오래 세워 둔 차는 작은 전기가 계속 빠져나가요.\n충전기(유지 충전기)를 연결해 두면 배터리가 오래가요.\n그래도 자주 방전되면 어디서 전기가 새는지 점검해요."], ["정비", "경고등이 켜지면 먼저 할 일", "빨간 경고등은 바로 안전한 곳에 세워요.\n노란 경고등은 천천히 가서 점검받아도 돼요.\n켜진 경고등 사진을 찍어 두면 정비소에서 설명하기 쉬워요."]], "community": [["안내", "I♥CC 래식카 경매예요. 명차 값이 어디까지 가는지, 차의 역사와 사진을 함께 볼 수 있어요.": "The world's top classic car auction house. See how high great cars go, with history and photos.", "(독일 · 공식)": "(Germany · Official)", "벤츠가 직접 운영하는 공식 클래식 사이트예요. 클래식 부품, 복원, 차종 역사를 한곳에서 봐요.": "Mercedes-Benz's official classic site. Classic parts, restoration and model history in one place.", "1793년에 시작한 영국 경매 회사예요. 굿우드 같은 큰 자동차 행사에서 클래식카 경매를 열어요. 낙찰 결과로 유럽 시세를 봐요.": "A British auction house founded in 1793. Runs classic car auctions at big events like Goodwood. Use the results to read European values.", "영국에서 가장 많이 팔리는 클래식카 잡지예요. 차종별 구매 가이드와 클럽·부품·정비 정보가 많아요.": "The UK's best-selling classic car magazine. Buying guides by model, plus clubs, parts and servicing info.", "(프랑스)": "(France)", "파리에서 해마다 열리는 세계적인 클래식카 전시회예요. 1976년에 처음 열렸고 부품과 매물도 함께 나와요.": "A world-famous classic car show held every year in Paris. First held in 1976, with parts and cars for sale too.", "(이탈리아)": "(Italy)", "1987년에 나온 이탈리아 대표 클래식카 잡지예요. 이탈리아 명차의 역사와 시승기가 많아요.": "Italy's leading classic car magazine since 1987. Lots of history and road tests of great Italian cars.", "(호주)": "(Australia)", "호주의 클래식카 전문 보험사예요. 온라인 커뮤니티 Shannons Club에서 행사와 소식을 나눠요.": "Australia's classic car insurer. Its online Shannons Club shares events and news.", "(일본)": "(Japan)", "일본 대표 중고차 장터예요. 옛 일본차와 수입 클래식 매물이 많아요.": "Japan's leading used car marketplace. Many old Japanese cars and imported classics.", "영국 귀족 영지에서 열리는 자동차 축제예요. 여름엔 언덕을 달리는 Festival of Speed, 가을엔 모두 옛날 옷을 입고 오는 Revival 레이스가 열려요.": "A motoring festival on an English country estate. Festival of Speed hill climb in summer, and the Revival races in autumn where everyone dresses vintage.", "캘리포니아 골프장 18번 홀 잔디에서 열리는 세계 최고 명차 품평회예요. 매년 8월, 200대 넘는 명차가 모여요.": "The world's top concours, held on the 18th fairway of a California golf course. Every August, over 200 great cars gather.", "1929년부터 코모 호숫가에서 열린 명차 품평회예요. 50대 남짓만 골라서 보여주는 아주 우아한 행사예요. BMW 그룹 클래식이 주최해요.": "A concours on the shore of Lake Como since 1929. Only about 50 cars are chosen, a very elegant event. Hosted by BMW Group Classic.", "1927~1957년에 열린 전설의 공도 레이스를 옛 차로 다시 달려요. 브레시아에서 로마까지 이탈리아를 한 바퀴 돌아요. '세상에서 가장 아름다운 레이스'라 불려요.": "The legendary 1927–1957 road race, driven again in old cars. From Brescia to Rome and back around Italy. Called \"the most beautiful race in the world.\"", "독일 에센에서 1989년부터 열리는 세계 최대급 클래식카 박람회예요. 클럽 200곳 이상과 차 2,700대 넘게 나와요. 부품 시장도 커요.": "One of the world's biggest classic car fairs, held in Essen, Germany since 1989. Over 200 clubs and 2,700+ cars, plus a big parts market.", "르망 24시 서킷에서 옛 르망 경주차들이 다시 달리는 축제예요. 오너가 직접 몰고 달려요.": "A festival where old Le Mans race cars run again on the Le Mans 24 Hours circuit. Owners drive them themselves.", "(네덜란드)": "(Netherlands)", "세계에서 가장 오래된 개인 자동차 컬렉션이에요. 1934년부터 모은 차 250대쯤을 헤이그 박물관에서 봐요.": "The world's oldest private car collection. About 250 cars collected since 1934, shown at the museum in The Hague.", "'클래식 미츠 모던'을 내건 일본 클래식카 박람회예요. 해마다 봄 마쿠하리 메세에서 열리고 옛 차를 사고팔기도 해요.": "Japan's classic car fair under the motto \"Classic Meets Modern.\" Held every spring at Makuhari Messe, with old cars for sale too.", "스위스 클래식카 잡지 사이트예요. 독일어·영어 기사와 행사·경매 소식이 많아요.": "A Swiss classic car magazine site. Articles in German and English, plus event and auction news.", "토요타가 세운 자동차 박물관이에요. 토요타 차만이 아니라 세계 여러 나라의 옛 차를 시대 순서로 보여줘요.": "A car museum founded by Toyota. Shows old cars from many countries in time order, not just Toyotas.", "› 드라이브": "› Drive", "첫 드라이브 기록을 남겨 주세요": "Share your first drive", "다녀온 길, 쉬어 간 곳, 길 상태 · 다음 사람이 그 길을 따라가요": "Where you went, where you rested, road conditions · the next driver will follow your route", "다리의 향연 창선·삼천포대교": "Changseon–Samcheonpo Bridges", "경남 사천-남해": "Sacheon–Namhae, Gyeongnam", "덕수궁 돌담길": "Deoksugung Stone Wall Road", "서울 중구": "Jung-gu, Seoul", "담양 메타세쿼이아 가로수길": "Damyang Metasequoia Road", "전남 담양군": "Damyang, Jeonnam", "십리 벚꽃길": "Ten-Ri Cherry Blossom Road", "경남 하동군": "Hadong, Gyeongnam", "바다 위의 도로 광안대로": "Gwangan Bridge

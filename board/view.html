<style>*{box-sizing:border-box}body{margin:0;background:#0E1219;color:#E8EAEE;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#2E7D4F;font-weight:800}.top button{margin-left:auto;height:34px;padding:0 14px;border:0;border-radius:8px;background:#fff;color:#1F4D36;font-weight:800;cursor:pointer}.row{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:14px;flex-wrap:wrap}.box h3{margin:0 0 6px;font-size:13px;color:#7FD99A}.pc{width:720px;height:560px;overflow:hidden;border:6px solid #262A33;border-radius:10px}.pc iframe{width:1440px;height:1120px;border:0;transform:scale(.5);transform-origin:0 0}.mo{width:390px;height:780px;border:8px solid #262A33;border-radius:30px;overflow:hidden}.mo iframe{width:390px;height:780px;border:0;display:block}</style></head><body>

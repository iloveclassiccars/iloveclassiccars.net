<style>*{box-sizing:border-box}body{margin:0;background:#2a2f3a;font:17px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#E8EAEE}.bar{background:#1F4D36;padding:10px 16px;font-weight:800}.bar small{font-weight:500;opacity:.8;margin-left:8px}.wr{max-width:1040px;margin:0 auto;padding:14px;display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}@media(max-width:820px){.wr{grid-template-columns:1fr;padding:8px}.cv{order:-1;padding:8px}}.f{background:#171B26;border:1px solid #2a3142;border-radius:14px;padding:14px}.f label{display:block;font-size:15px;color:#9AA3B2;margin:10px 0 4px}.f label:first-child{margin-top:0}.f input,.f select{width:100%;height:50px;border-radius:9px;border:1px solid #3a4256;background:#0f131b;color:#fff;font:inherit;padding:0 10px;font-size:17px}.row{display:flex;gap:8px}.row>*{flex:1}.cv{background:#171B26;border:1px solid #2a3142;border-radius:14px;padding:14px}canvas{width:100%;height:auto;display:block;border-radius:12px}.btn{display:block;width:100%;height:56px;margin-top:12px;border:0;border-radius:10px;background:#1B8438;color:#fff;font:inherit;font-weight:800;font-size:19px;cursor:pointer}.tip{font-size:15px;color:#C9CEDA;margin-top:8px}.ok{color:#7FD99A}</style></head><body>
<div class="bar">I ♥ Classic Cars <small>디피 — 네임카드 만들기 (적으면 바로 카드가 바뀝니다)</small></div>

var BODY={R129:"roadster",R107:"roadster",W113:"roadster",R170:"roadster",NA:"roadster",W208:"coupe","964":"coupe","993":"coupe","944":"coupe","928":"coupe",AE86:"coupe",R32:"coupe",FD:"coupe",W463:"suv","갤로퍼":"suv","포니":"hatch","포니2":"hatch","프라이드":"hatch"};
var BN={sedan:"SEDAN",coupe:"COUPE",roadster:"ROADSTER",suv:"SUV",wagon:"WAGON",hatch:"HATCHBACK"};
function $(i){return document.getElementById(i)}
var dn;try{dn=new Intl.DisplayNames(["ko"],{type:"region"})}catch(e){}
var CC="KR US JP DE GB FR IT CN TW HK SG AU CA NL SE CH BE AT ES NZ TH MY PH VN ID IN AE BR MX".split(" ");
function fl(c){return String.fromCodePoint.apply(null,c.split("").map(function(x){return 127397+x.charCodeAt(0)}))}
$("cc").innerHTML=CC.map(function(c){return'<option value="'+c+'">'+(dn?dn.of(c):c)+"</option>"}).join("");
var MK=[];CARS.forEach(function(x){if(MK.indexOf(x[0])<0)MK.push(x[0])});
$("mk").innerHTML=MK.map(function(m){return"<option>"+m+"</option>"}).join("");
function fillCd(){var m=$("mk").value;$("cd").innerHTML=CARS.filter(function(x){return x[0]==m}).map(function(x){return"<option>"+x[1]+"</option>"}).join("");fillMd()}
function car(){var m=$("mk").value,c=$("cd").value;return CARS.filter(function(x){return x[0]==m&&x[1]==c})[0]}
function fillMd(){var x=car();$("md").innerHTML=x[3].map(function(v){return"<option>"+v+"</option>"}).join("");autoBd()}
function autoBd(){var x=car(),md=$("md").value;var b=BODY[x[1]]||"sedan";if(/T[E]?$|TE|T$/.test(md)&&b=="sedan")b="wagon";if(/SEC|CE|CL6|CLK/.test(md))b="coupe";if(/^SL/.test(md))b="roadster";$("bd").value=b;draw()}
$("mk").onchange=fillCd;$("cd").onchange=fillMd;$("md").onchange=autoBd;
["nk","cc","yr","bd","sn","ac","em"].forEach(function(i){$(i).oninput=$(i).onchange=draw});
var IM={},logo=new Image();logo.src="/icons/icon-192.png";logo.onload=draw;
Object.keys(BN).forEach(function(k){IM[k]=new Image();IM[k].src="/img/nc/"+k+".png";IM[k].onload=draw});
function rr(x,c,y,w,h,r){x.beginPath();x.moveTo(c+r,y);x.arcTo(c+w,y,c+w,y+h,r);x.arcTo(c+w,y+h,c,y+h,r);x.arcTo(c,y+h,c,y,r);x.arcTo(c,y,c+w,y,r);x.closePath()}
var F='-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
function draw(){var cv=$("c"),P=matchMedia("(max-width:820px)").matches,W=P?720:1080,H=P?1260:640;if(cv.width!=W||cv.height!=H){cv.width=W;cv.height=H}var x=cv.getContext("2d");x.clearRect(0,0,W,H);x.fillStyle="#171B26";x.fillRect(0,0,W,H);
var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#24402f");g.addColorStop(1,"#1c2433");rr(x,0,0,W,H,36);x.fillStyle=g;x.fill();x.lineWidth=4;x.strokeStyle="#2AA84B";rr(x,2,2,W-4,H-4,34);x.stroke();
x.fillStyle="#7FD99A";x.font="700 26px "+F;x.fillText("MEMBER NAME CARD",56,90);
x.fillStyle="#fff";x.font="900 "+(P?84:76)+"px "+F;x.fillText(($("nk").value||"닉네임").slice(0,16),52,P?190:168);
var o=$("cc").selectedOptions[0];x.fillStyle="#C9CEDA";x.font="500 "+(P?38:34)+"px "+F;x.fillText(o?o.textContent:"",56,P?250:222);
if(logo.complete&&logo.naturalWidth){var L=P?116:108;x.save();rr(x,W-L-48,44,L,L,22);x.clip();x.drawImage(logo,W-L-48,44,L,L);x.restore()}
var b=$("bd").value,im=IM[b];if(im&&im.complete&&im.naturalWidth){if(P)x.drawImage(im,50,310,620,183);else x.drawImage(im,W-450,214,400,118)}
var c=car(),rows=[["내 차",c[0].replace("Mercedes-Benz","벤츠")+" "+c[1]+" · "+$("md").value+" · "+($("yr").value||"")],["SNS",$("sn").value+" @"+($("ac").value||"")],["이메일",mk($("em").value||"")],["가입일",new Date().toISOString().slice(0,10).replace(/-/g,".")]];
rows.forEach(function(r,i){if(P){var y=600+i*136;x.fillStyle="#9AA3B2";x.font="500 32px "+F;x.fillText(r[0],56,y);x.fillStyle="#fff";x.font="700 42px "+F;fit(x,r[1],56,y+54,W-112)}else{var y=424+i*52;x.fillStyle="#9AA3B2";x.font="500 30px "+F;x.fillText(r[0],56,y);x.fillStyle="#fff";x.font="700 33px "+F;fit(x,r[1],210,y,W-266)}});
x.fillStyle="#E8EAEE";x.font="900 "+(P?30:24)+"px "+F;x.textAlign="right";x.fillText("iloveclassiccars.net",W-56,H-(P?50:34));x.textAlign="left"}
function mk(e){var p=e.split("@");if(p.length<2)return e;return p[0].slice(0,Math.min(4,Math.max(1,p[0].length-2)))+"••••@"+p[1]}
function fit(x,t,X,Y,M){var f=x.font,n=parseInt(f.match(/(\d+)px/)[1]);while(x.measureText(t).width>M&&n>16){n--;x.font=f.replace(/\d+px/,n+"px")}x.fillText(t,X,Y)}
addEventListener("resize",draw);
$("sv").onclick=function(){$("c").toBlob(function(bl){var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="namecard-"+($("nk").value||"me")+".png";document.body.appendChild(a);a.click();a.remove();$("msg").textContent="저장했습니다. 휴대폰은 사진/다운로드 폴더를 확인하십시오."},"image/png")};
var SNSP={"KR":["네이버","카카오","인스타그램","유튜브","X","페이스북"],"JP":["LINE","X","인스타그램","유튜브","믹시","페이스북"],"CN":["위챗","웨이보","더우인","샤오훙수","비리비리","QQ"],"TW":["LINE","페이스북","인스타그램","유튜브","X","스레드"],"TH":["LINE","페이스북","틱톡","인스타그램","유튜브","X"],"VN":["잘로","페이스북","틱톡","유튜브","인스타그램","X"],"RU":["VK","텔레그램","오드노클라스니키","유튜브","왓츠앱","Viber"],"_":["인스타그램","페이스북","유튜브","X","틱톡","왓츠앱"]},SNSALL=["네이버","카카오","X","페이스북","인스타그램","유튜브","틱톡","스레드","구글","애플","LINE","위챗","웨이보","QQ","샤오훙수","비리비리","더우인","VK","오드노클라스니키","텔레그램","왓츠앱","링크드인","핀터레스트","레딧","스냅챗","디스코드","텀블러","블루스카이","마스토돈","잘로","네이버 밴드","다음","믹시","Viber","Signal"];
function fillSn(){var c=$("cc").value,top=SNSP[c]||SNSP._,cur=$("sn").value;var h=top.concat(SNSALL.filter(function(v){return top.indexOf(v)<0})).map(function(v){return"<option>"+v+"</option>"}).join("");$("sn").innerHTML=h;if(cur&&SNSALL.indexOf(cur)>=0)$("sn").value=cur}

</script></body></html>
